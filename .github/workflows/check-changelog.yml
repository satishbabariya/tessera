# Requires a CHANGELOG.md entry on every pull request, or the 'no-changelog'
# label. Working without a reviewer is exactly where mechanical discipline earns
# its keep.
#
# The third-party actions below are pinned by commit SHA rather than by tag: a
# tag can be moved to point at different code, a SHA cannot.

name: "Check Changelog"
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: Enforce Changelog
        uses: dangoslen/changelog-enforcer@c0b9fd225180a405c5f21f7a74b99e2eccc3e951 # v3.6.0
        with:
          skipLabels: no-changelog
          missingUpdateErrorMessage: Please add an entry in CHANGELOG.md or apply the 'no-changelog' label to skip this check.
