name: build

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A stacked pull request --
  # one whose base is another feature branch -- got no build matrix at all under
  # `branches: [main]`, so `gh pr checks` showed two green checks and nothing
  # else. Two passing checks and seven passing checks look the same if you count
  # failures rather than reading the list, and #31 was one step from being merged
  # on that basis.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    # A test that dead-locks would otherwise hold a runner for GitHub's six-hour
    # default; the whole matrix finishes well inside 60. This stays as a
    # backstop, but the per-step timeouts below are what should fire first --
    # a job killed by THIS one is reported as `cancelled`, which is the same
    # word GitHub uses for a concurrency cancellation. A hanging ObjectStoreTests
    # sat behind that ambiguity for two hours, read as "still running".
    #
    # A step killed by its own `timeout-minutes` is reported as `failure`.
    # Measured, not assumed:
    #
    #     JOB probe: completed/failure
    #         2. A step that finishes: completed/success
    #         3. A step that overruns its own timeout: completed/failure
    #         4. A step after the timeout: completed/skipped
    #
    # See docs/findings/0b-a-hang-should-look-like-a-failure.md.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc,   cc: gcc-13,   cxx: g++-13,     build_type: Debug }
          - { os: ubuntu-latest, compiler: clang, cc: clang-18, cxx: clang++-18, build_type: Debug }
          - { os: ubuntu-latest, compiler: gcc,   cc: gcc-13,   cxx: g++-13,     build_type: Release }
          - { os: macos-latest,  compiler: clang, cc: clang,    cxx: clang++,    build_type: Debug }
          - { os: macos-latest,  compiler: clang, cc: clang,    cxx: clang++,    build_type: Release }

    steps:
      # #37 put a timeout on every step that does work, because a job killed by
      # the job-level timeout reports as `cancelled` -- the same word GitHub uses
      # for a concurrency cancellation -- while a step killed by its own timeout
      # reports `failure`. It did not cover the step that fetches the work, and
      # that is where the next hang landed: `macos-latest clang Debug` sat in
      # checkout for 32 minutes while the other four jobs finished, and would
      # have run to the job's 60 and reported `cancelled`.
      #
      # Ten minutes is generous. A healthy checkout of this repository, including
      # the Catch2 submodule, takes about seven seconds.
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          submodules: recursive   # the test suites need Catch2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev libcurl4-openssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # These encode structural decisions. They are cheap, so they run first:
      # a layering violation should not wait on a full build to be reported.
      - name: Invariant checks
        run: |
          tools/check-copyright-notices.sh 560
          tools/check-no-vendor-hosts.sh
          tools/check-layering.sh
          tools/check-merge-deps.sh
          tools/check-header-tiers.sh
          tools/check-repo-hygiene.sh
          tools/check-server-not-shipped-unauthenticated.sh
          tools/check-test-sources-listed.sh
          tools/check-header-macros.sh
          tools/check-rename-residue.sh
          tools/check-no-upstream-urls-in-output.sh
          tools/check-include-root-is-clean.sh
          tools/check-cert-expiry.sh
          tools/test-pr-status.sh
          tools/test-pre-push.sh

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # No target argument, deliberately. The test suites do not compile the
      # command-line tools, so a target-limited build silently excludes code
      # from verification. That has caused breakage twice in this project.
      - name: Build everything
        timeout-minutes: 35
        run: cmake --build build --parallel

      # A fresh TMPDIR per run: the suites leak temporary directories, and a
      # large temp directory degrades some tests by four orders of magnitude.
      - name: CoreTests
        timeout-minutes: 20
        run: |
          export TMPDIR="$(mktemp -d)/"
          "$(tools/verify/test-binary.sh build tessera-tests)"
        env:
          UNITTEST_THREADS: 2

      # The whole point of the change that enabled this test is that it had never
      # executed its body. A test that goes dead again would show up as nothing:
      # the suite total simply stops including it, and no one knows what the
      # total should be. So assert directly that it ran and that it checked
      # something.
      #
      # Linux only, because it needs robust POSIX mutexes. macOS reports
      # _POSIX_THREADS as 200112L where the check requires 200809L, so the test
      # is correctly disabled there and the framework now says so.
      - name: The crash-safety test actually ran
        if: runner.os == 'Linux'
        run: |
          export TMPDIR="$(mktemp -d)/"
          out=$(UNITTEST_FILTER='Shared_RobustAgainstDeathDuringWrite' \
                "$(tools/verify/test-binary.sh build tessera-tests)" 2>&1)
          echo "$out" | tail -5
          case "$out" in
            *"All 1 tests passed (0 checks)"*)
              echo "FAIL: it ran but checked nothing -- the runtime guard returned early"
              exit 1 ;;
            *"All 1 tests passed"*)
              echo "OK: the crash-safety test ran and checked something" ;;
            *)
              echo "FAIL: the crash-safety test did not run at all"
              exit 1 ;;
          esac

      # This suite holds 'sync: error handling / reports DNS error', which used
      # to resolve invalid.com -- a registered domain, answering SERVFAIL rather
      # than NXDOMAIN, so the resolver retried upstream. Four runs of this binary
      # gave 4.2s, 680.6s (failing), 13.7s and 0.011s. It now resolves
      # host.invalid, reserved by RFC 6761, which resolvers answer immediately:
      # five consecutive runs of that section took 0.06-0.08s.
      #
      # The note describing that flakiness used to sit on the SyncTests step
      # below, and said the suite was "excluded from the merge gate". The test is
      # in this suite, and neither suite was ever excluded -- both steps gate,
      # with no `if:` and no continue-on-error. A comment claiming a mitigation
      # that does not exist is worse than no comment: it answers the question
      # somebody would otherwise ask.
      - name: ObjectStoreTests
        timeout-minutes: 20
        run: |
          export TMPDIR="$(mktemp -d)/"
          "$(tools/verify/test-binary.sh build tessera-object-store-tests)"

      # UNITTEST_THREADS=1, and deliberately left alone.
      #
      # Nothing records why it is 1 here, unlike nightly.yml, where 1 is a
      # documented choice for the sanitizer baseline. So it was measured on
      # macOS: twelve runs of this suite, all 476 tests passing at 1, 4 and 8
      # threads, taking 21.1s at 1 and 6.8-7.3s at 4. Parallel works.
      #
      # It stays at 1 anyway. This step takes 2.9 minutes of a 21-minute job on
      # ubuntu-latest gcc Release, where "Build everything" takes 13.6 -- so the
      # whole prize is about two minutes, under a tenth of the job. Buying that
      # with a concurrency change to the merge gate is a bad trade: the evidence
      # is from one platform, a race that passes twelve times can fail the
      # thirteenth, and a merge gate that fails intermittently trains everyone
      # to ignore red builds. That last sentence is this repository's own
      # reasoning, written about a different flaky test in this same file.
      #
      # The build is where the 13.6 minutes are. That is the thing worth
      # attacking.
      #
      # Incidentally, this suite's check count is not reproducible: twelve runs
      # gave totals from 39,039 to 125,116 with all 476 tests passing every
      # time, at every thread count including 1. It is one test --
      # Network_RepeatedCancelAndRestartRead, about 70% of the suite's checks,
      # measured at 84,220, 67,377 and 85,395 in isolation. It pushes 64 MiB
      # through a socket pair and CHECKs once per read completion, so its count
      # is however many times the kernel and the thread scheduler decide to
      # complete a read. Pinning UNITTEST_RANDOM_SEED fixes the write sizes and
      # not that, which is why it was measured and did not help.
      #
      # So a check-count baseline for SyncTests would be meaningless, which
      # matters because this project uses such baselines elsewhere. One that
      # excluded that test, or counted per test, would work.
      - name: SyncTests
        timeout-minutes: 25
        run: |
          export TMPDIR="$(mktemp -d)/"
          "$(tools/verify/test-binary.sh build tessera-sync-tests)"
        env:
          UNITTEST_THREADS: 1

      - name: Authorization holds through the binaries
        timeout-minutes: 10
        run: tools/verify/authorization-end-to-end.sh build

      - name: The server survives a hard kill
        timeout-minutes: 10
        run: tools/verify/survives-a-hard-kill.sh build

      - name: Consumer smoke test
        timeout-minutes: 10
        run: tools/verify/consumer-smoke-test.sh build
