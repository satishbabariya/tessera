name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # TSan matters disproportionately here. The concurrency model is a
  # shared-memory interprocess mutex plus a lock-free version ringbuffer, which
  # is exactly the shape of code where data races hide. These are slow, so they
  # are nightly rather than merge-gating.
  sanitizers:
    name: sanitizer ${{ matrix.san }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev libcurl4-openssl-dev
      - name: Configure with ${{ matrix.san }}
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer"
      - run: cmake --build build --parallel
      - name: CoreTests under ${{ matrix.san }}
        run: |
          export TMPDIR="$(mktemp -d)/"
          "$(tools/verify/test-binary.sh build tessera-tests)"
        env: { UNITTEST_THREADS: 1 }

      # The sync suite is where the concurrency lives: real in-process servers,
      # client sessions, and the merge engine running against them. Phase 1
      # reworks exactly this code, so a clean baseline here is worth more than
      # one for the suite that will not change.
      #
      # Only under TSan. The sync tests are slow, and address and undefined
      # behaviour are already covered by CoreTests over the same engine.
      - name: SyncTests under thread sanitizer
        if: matrix.san == 'thread'
        run: |
          export TMPDIR="$(mktemp -d)/"
          "$(tools/verify/test-binary.sh build tessera-sync-tests)"
        env: { UNITTEST_THREADS: 1 }

      # The object-store layer delivers change notifications from a background
      # worker thread, so it is concurrent code that CoreTests does not cover.
      # It runs in about 23 seconds uninstrumented, which is cheap enough to
      # include under every sanitizer rather than only under TSan.
      - name: ObjectStoreTests under ${{ matrix.san }}
        run: |
          export TMPDIR="$(mktemp -d)/"
          "$(tools/verify/test-binary.sh build tessera-object-store-tests)"

  # Tier-1 platforms that cannot run their own tests here. Compiling is a real
  # signal: three of this project's build failures were platform-specific
  # missing includes that only a different standard library revealed.
  compile-only:
    name: compile ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: wasm,    os: ubuntu-latest }
          - { target: android, os: ubuntu-latest }
          - { target: ios,     os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - if: matrix.target == 'wasm'
        uses: mymindstorm/setup-emsdk@v14
      - name: Build the storage engine
        run: |
          case "${{ matrix.target }}" in
            wasm)
              emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -DTESSERA_NO_TESTS=ON
              ;;
            android)
              # Sync and encryption are both off. Android needs OpenSSL for
              # either -- CMakeLists.txt:290 for sync, :296 for encryption --
              # and the NDK ships none, so enabling either means
              # cross-compiling OpenSSL for four ABIs, a project in itself.
              #
              # What this job therefore verifies is narrower than it looks: the
              # storage engine compiles for Android. Sync and encryption on
              # Android are unverified, and are documented as such rather than
              # implied by a green tick. docs/findings/0a-supply-chain.md
              # predicted this decision and named the options.
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DTESSERA_NO_TESTS=ON \
                    -DTESSERA_ENABLE_SYNC=OFF -DTESSERA_ENABLE_ENCRYPTION=OFF \
                    -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
                    -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
              ;;
            ios)
              cmake -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DTESSERA_NO_TESTS=ON
              ;;
          esac
          cmake --build build --target Storage --parallel

  # Tier 2: Windows is supported but does not gate merges. Deleting working
  # platform support and re-adding it later costs far more than keeping it
  # compiling.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      # Windows runners ship neither zlib nor OpenSSL, and both are needed for
      # sync. vcpkg is preinstalled on these images.
      - name: Install dependencies
        run: vcpkg install zlib:x64-windows openssl:x64-windows
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DTESSERA_NO_TESTS=ON `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
                -DVCPKG_TARGET_TRIPLET=x64-windows
      - run: cmake --build build --config Debug --parallel

  # tools/verify/clean-clone-test.sh was written after the first genuine clean
  # clone failed to configure -- a submodule the README did not mention. It was
  # then not wired into anything, so for a while it did not run at all, which is
  # the state test_util_enum.cpp was in: a verification that exists and does not
  # execute. See docs/findings/0b-uncompiled-test-file.md. This job is what
  # executes it; the sentence above is why it exists, not a description of now.
  #
  # It clones from the published URL rather than using the checkout, because the
  # thing under test is arriving at the project from outside. That makes it slow
  # and makes it test main rather than the pull request, which is why it is
  # nightly.
  clean-clone:
    name: clean clone
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev libcurl4-openssl-dev
      - name: A stranger can clone this and build it
        run: tools/verify/clean-clone-test.sh

  # For a storage engine a bug corrupts a file rather than returning a wrong
  # answer, so fuzzing the allocator and cluster tree is worth more than most
  # unit tests -- and the fuzzer already existed. This rationale used to sit on
  # the clean-clone job above, two comments having run together, so the reason
  # for fuzzing was filed under cloning and this job had no stated reason at all.
  fuzzers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev
      # tessera-libfuzzer only exists when TESSERA_LIBFUZZER is on, and that
      # option requires clang: it compiles with -fsanitize=fuzzer.
      - name: Configure with libfuzzer
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTESSERA_LIBFUZZER=ON
      - run: cmake --build build --target tessera-libfuzzer --parallel
      - name: Fuzz the storage engine for ten minutes
        run: |
          # A crash here means a malformed file can corrupt or crash the engine,
          # which for a storage engine matters more than most unit tests.
          timeout 600 ./build/test/fuzzy/tessera-libfuzzer -max_total_time=570 || rc=$?
          # 124 is timeout's own signal that the budget elapsed without a crash.
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
            echo "fuzzer exited $rc -- a crash or leak was found"
            exit 1
          fi
